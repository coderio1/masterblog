<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>My Blog</h1>

    <a href="{{ url_for('add') }}" class="add-button">Add New Post</a>

    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p class="author">By {{ post.author }}</p>
            <p>{{ post.content }}</p>

            <a href="{{ url_for('update', post_id=post.id) }}" class="btn btn-update">Update</a>
            <a href="{{ url_for('delete', post_id=post.id) }}" class="btn btn-delete"
               onclick="return confirm('Are you sure you want to delete this post?');">Delete</a>
            <a href="{{ url_for('like', post_id=post.id) }}" class="btn btn-like">&#10084; {{ post.likes }}</a>
        </div>
    {% else %}
        <p>No blog posts yet. Be the first to add one!</p>
    {% endfor %}
</body>
</html>
